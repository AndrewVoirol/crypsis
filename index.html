
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypsis - Tactical Field Expedition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            cursor: none; /* We will use a custom reticle */
        }
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
        .crt-flicker {
            animation: flicker 0.15s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        .hud-border {
            border: 1px solid rgba(0, 255, 65, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.1);
        }
        .glitch-text {
            text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9;
        }
        /* Custom Reticle Styles */
        #custom-cursor {
            width: 40px;
            height: 40px;
            border: 1px solid #00ff41;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }
        #custom-cursor::before, #custom-cursor::after {
            content: '';
            position: absolute;
            background: #00ff41;
        }
        #custom-cursor::before { width: 10px; height: 1px; }
        #custom-cursor::after { width: 1px; height: 10px; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="crt-flicker">
    <div class="scanlines"></div>
    <div id="custom-cursor">
        <div class="absolute -top-6 text-[10px] whitespace-nowrap opacity-50 tracking-tighter">SIG_SCAN: ACTIVE</div>
    </div>
    <div id="root"></div>
    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX - 20 + 'px';
            cursor.style.top = e.clientY - 20 + 'px';
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
